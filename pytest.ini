[pytest]
testpaths = tests
pythonpath = .
norecursedirs =
    scripts
    services/valuation.backup_before_driver_dcf
markers =
    unit: deterministic test of one module or domain service; must not use network
    integration: deterministic multi-module test using fixtures or mocks; must not use live network
    e2e: end-to-end report-generation test
    live_provider: optional test that may call a live external provider
addopts = -ra
