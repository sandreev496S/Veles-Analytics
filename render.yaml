services:
  - type: web
    name: veles-dcf-analyst
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    autoDeploy: false
    envVars:
      - key: APP_MODE
        value: demo
